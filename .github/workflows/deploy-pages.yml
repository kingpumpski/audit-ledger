name: Build and deploy Audit Ledger to GitHub Pages

on:
  pull_request:
    branches:
      - main
      - integration/reconcile-six-lovable-branches
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest
    env:
      # These are public client settings; never put a service-role key here.
      VITE_SUPABASE_PROJECT_ID: phfpbqlhxagonpofzvtn
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_QpziCdEvB4Kw1iuedjiqvw_6c8vL8n7
      VITE_SUPABASE_URL: https://phfpbqlhxagonpofzvtn.supabase.co
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test -- --reporter=dot

      - name: Verify committed lockfile is synchronized
        run: git diff --exit-code -- package-lock.json

      - name: Verify public Supabase build configuration
        run: |
          test -n "$VITE_SUPABASE_PROJECT_ID"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_SUPABASE_URL"

      - name: Build production site
        run: npm run build

      - name: Verify Pages contains compiled JavaScript entry points
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          const html = readFileSync('dist/index.html', 'utf8');
          if (html.includes('src/main.tsx') || html.includes('src/main.ts')) {
            throw new Error('Production HTML still references the raw TypeScript entry point.');
          }

          if (html.includes('%BASE_URL%')) {
            throw new Error('Production HTML contains an unresolved %BASE_URL% placeholder.');
          }
          if (!existsSync('dist/favicon.ico')) {
            throw new Error('The production favicon is missing from the Pages artifact.');
          }

          const scripts = [...html.matchAll(/<script[^>]+src="([^"]+\.js)"/g)];
          if (scripts.length === 0) {
            throw new Error('No compiled JavaScript module entry was found in dist/index.html.');
          }

          for (const [, src] of scripts) {
            const relativePath = src.replace(/^\/audit-ledger\//, '');
            if (!existsSync(resolve('dist', relativePath))) {
              throw new Error(`Compiled module referenced by HTML is missing: ${src}`);
            }
          }

          writeFileSync('dist/.nojekyll', '');
          console.log(`Verified ${scripts.length} compiled module entry point(s).`);
          NODE

      - name: Add GitHub Pages deep-link fallback
        run: |
          cat > dist/404.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
            <body>
              <script>
                const segments = window.location.pathname.split("/").filter(Boolean);
                const repository = segments.shift() || "audit-ledger";
                const route = segments.join("/");
                const query = window.location.search.slice(1);
                const destination = "/" + repository + "/?p=" + encodeURIComponent(route)
                  + (query ? "&q=" + encodeURIComponent(query) : "")
                  + window.location.hash;
                window.location.replace(destination);
              </script>
              <p>Redirecting to Audit Ledger…</p>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify GitHub Pages publishes GitHub Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISHING_SOURCE="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [ "$PUBLISHING_SOURCE" != "workflow" ]; then
            echo "::error::GitHub Pages is configured to publish from '$PUBLISHING_SOURCE'. Set Settings > Pages > Build and deployment > Source to GitHub Actions."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
