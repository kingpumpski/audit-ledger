name: Build and deploy Audit Ledger to GitHub Pages

on:
  pull_request:
    branches:
      - main
      - integration/reconcile-six-lovable-branches
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GitHub Pages artifact
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm test -- --reporter=dot

      - name: Verify committed lockfile is synchronized
        run: git diff --exit-code -- package-lock.json

      - name: Verify public Supabase build configuration
        run: |
          test -n "$VITE_SUPABASE_PROJECT_ID"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_SUPABASE_URL"

      - name: Build production site
        run: npm run build

      - name: Verify Pages contains compiled JavaScript entry points
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { resolve } from 'node:path';

          const html = readFileSync('dist/index.html', 'utf8');
          if (html.includes('src/main.tsx') || html.includes('src/main.ts')) {
            throw new Error('Production HTML still references the raw TypeScript entry point.');
          }

          const scripts = [...html.matchAll(/<script[^>]+src="([^"]+\.js)"/g)];
          if (scripts.length === 0) {
            throw new Error('No compiled JavaScript module entry was found in dist/index.html.');
          }

          for (const [, src] of scripts) {
            const relativePath = src.replace(/^\/audit-ledger\//, '');
            if (!existsSync(resolve('dist', relativePath))) {
              throw new Error(`Compiled module referenced by HTML is missing: ${src}`);
            }
          }

          writeFileSync('dist/.nojekyll', '');
          console.log(`Verified ${scripts.length} compiled module entry point(s).`);
          NODE

      - name: Add SPA route fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy GitHub Pages site
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
